<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LLM Operators Diagram</title>
  <style>
    :root {
      --ink: #0b1f2a;
      --muted: #5b6b73;
      --stroke: #0f2f3d;
      --bg: #ffffff;
      --box: #ffffff;
      --shadow: 0 10px 30px rgba(15, 47, 61, .10);
      --radius: 18px;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--ink);
      padding: 24px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .box {
      fill: var(--box);
      stroke: var(--stroke);
      stroke-width: 2.2;
      filter: drop-shadow(0px 10px 18px rgba(0, 0, 0, .10));
    }

    .box-dashed {
      fill: var(--box);
      stroke: var(--stroke);
      stroke-width: 2.2;
      stroke-dasharray: 6 6;
      filter: drop-shadow(0px 10px 18px rgba(0, 0, 0, .08));
    }

    .label {
      font-size: 26px;
      font-weight: 700;
      fill: var(--ink);
    }

    .sub {
      font-size: 22px;
      font-weight: 600;
      fill: var(--ink);
    }

    .muted {
      font-size: 18px;
      font-weight: 600;
      fill: var(--muted);
    }

    .codeBox {
      fill: #111827;
      stroke: #111827;
      stroke-width: 0;
      rx: 14;
      ry: 14;
      filter: drop-shadow(0px 10px 18px rgba(0, 0, 0, .18));
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 16px;
      fill: #e5e7eb;
    }

    .code .kw {
      fill: #a78bfa;
    }

    .code .fn {
      fill: #fbbf24;
    }

    .code .cm {
      fill: #9ca3af;
    }

    .code .id {
      fill: #93c5fd;
    }

    .code .num {
      fill: #34d399;
    }

    .miniCode {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      fill: var(--ink);
    }

    .miniCode .kw {
      fill: #7c3aed;
    }

    .miniCode .fn {
      fill: #d97706;
    }

    .miniCode .id {
      fill: #2563eb;
    }

    .miniCode .num {
      fill: #16a34a;
    }

    .miniCode .op {
      fill: #0f766e;
    }

    .miniCode .cm {
      fill: #6b7280;
    }

    .wavy {
      stroke: #ef4444;
      stroke-width: 2.2;
      fill: none;
    }

    .addLine {
      stroke: #0f766e;
      stroke-width: 2.2;
      stroke-dasharray: 6 6;
      stroke-linecap: round;
      fill: none;
    }

    .pseudoBox {
      fill: #f8fafc;
      stroke: var(--stroke);
      stroke-width: 2.2;
      filter: drop-shadow(0px 10px 18px rgba(15, 47, 61, .12));
    }

    .pseudoLine {
      stroke: #e2e8f0;
      stroke-width: 1.2;
    }

    .pseudoGutter {
      stroke: #cbd5e1;
      stroke-width: 1.6;
    }

    .pseudoText {
      font-family: "IBM Plex Mono", "Fira Code", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 18px;
      fill: #0b1f2a;
    }

    .pseudoText .kw {
      fill: #0f766e;
      font-weight: 700;
    }

    .pseudoText .fn {
      fill: #b45309;
    }

    .pseudoText .id {
      fill: #2563eb;
    }

    .pseudoText .op {
      fill: #334155;
    }

    .pseudoText .sym {
      fill: #0b1f2a;
      font-weight: 600;
    }

    .pseudoNum {
      font-family: "IBM Plex Mono", "Fira Code", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 16px;
      fill: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- Diagram is drawn as a single SVG so arrows are easy -->
    <svg viewBox="0 0 1240 650" role="img" aria-label="LLM Operators Diagram">
      <defs>
        <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
          <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--stroke)"></path>
        </marker>

        <marker id="arrowThin" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
          <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--stroke)"></path>
        </marker>

        <marker id="plusMarker" markerWidth="16" markerHeight="16" refX="8" refY="8" orient="auto">
          <circle cx="8" cy="8" r="6.5" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"></circle>
          <path d="M8 4.5 V11.5 M4.5 8 H11.5" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round"></path>
        </marker>

        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".10" />
        </filter>
      </defs>

      <!-- Left: Input -->
      <rect class="box" x="70" y="245" width="260" height="150" rx="18" ry="18"></rect>
      <text class="label" x="120" y="330">Input: Φ*</text>

      <!-- Center: Operators (dashed) -->
      <rect class="box-dashed" x="370" y="245" width="360" height="150" rx="18" ry="18"></rect>
      <text class="label" x="485" y="305">Operators</text>
      <text class="sub" x="445" y="350">E1, E2, M1, M2, M3</text>

      <!-- Bottom center: Generated problems -->
      <rect class="box" x="370" y="450" width="360" height="150" rx="18" ry="18"></rect>
      <text class="label" x="420" y="500">Generated problems</text>
      <!-- more explicit "function code" icons -->
      <g transform="translate(390,504)">
        <rect x="0" y="18" width="140" height="78" rx="10" ry="10" fill="#fff" stroke="var(--stroke)"
          stroke-width="2.2" />
        <rect x="0" y="18" width="140" height="20" rx="10" ry="10" fill="#eef2f5" stroke="var(--stroke)"
          stroke-width="2.2" />
        <circle cx="14" cy="28" r="3.2" fill="var(--stroke)" />
        <circle cx="26" cy="28" r="3.2" fill="var(--stroke)" opacity=".55" />
        <circle cx="38" cy="28" r="3.2" fill="var(--stroke)" opacity=".25" />
        <g class="miniCode" transform="translate(12,52)">
          <text x="0" y="0">
            <tspan class="kw">def</tspan>
            <tspan> </tspan>
            <tspan class="fn">f</tspan>
            <tspan>(x):</tspan>
          </text>
          <text x="0" y="16">
            <tspan class="kw">return</tspan>
            <tspan> </tspan>
            <tspan class="id">2</tspan>
            <tspan class="op"> * </tspan>
            <tspan class="id">x[0]</tspan>
          </text>
        </g>
      </g>
      <g transform="translate(550,504)">
        <rect x="0" y="18" width="140" height="78" rx="10" ry="10" fill="#fff" stroke="var(--stroke)"
          stroke-width="2.2" />
        <rect x="0" y="18" width="140" height="20" rx="10" ry="10" fill="#eef2f5" stroke="var(--stroke)"
          stroke-width="2.2" />
        <circle cx="14" cy="28" r="3.2" fill="var(--stroke)" />
        <circle cx="26" cy="28" r="3.2" fill="var(--stroke)" opacity=".55" />
        <circle cx="38" cy="28" r="3.2" fill="var(--stroke)" opacity=".25" />
        <g class="miniCode" transform="translate(12,52)">
          <text x="0" y="0">
            <tspan class="kw">def</tspan>
            <tspan> </tspan>
            <tspan class="fn">g</tspan>
            <tspan>(x):</tspan>
          </text>
          <text x="0" y="16">
            <tspan class="kw">return</tspan>
            <tspan> </tspan>
            <tspan class="id">x[1]</tspan>
          </text>
        </g>
      </g>

      <!-- Top center: brain icon + LLM -->
      <g transform="translate(480,59)">
        <!-- brain icon from brain.svg -->
        <g transform="scale(0.52) translate(-20, -20)">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M129.49 114.51C129.121 116.961 128.187 119.293 126.762 121.322C125.337 123.351 123.461 125.021 121.28 126.2C120.676 126.535 120.043 126.816 119.39 127.04C120.22 138.04 102.74 142.04 93.32 139.42L96.82 151.66L87.82 151.98L72.07 129.43C66.76 130.93 60.49 131.65 56.44 125.15C56.0721 124.553 55.7382 123.935 55.44 123.3C54.4098 123.51 53.3614 123.617 52.31 123.62C49.31 123.62 44.31 122.72 41.77 120.96C39.7563 119.625 38.1588 117.75 37.16 115.55C31.75 116.29 27.16 115.02 24.16 111.88C20.36 107.97 19.28 101.51 21.26 94.58C23.87 85.33 31.81 74.91 47.59 71C48.9589 69.2982 50.5972 67.8322 52.44 66.66C62.35 60.31 78.44 59.76 90.65 65.79C95.3836 64.9082 100.27 65.376 104.75 67.14C113.53 70.43 119.91 77.31 121.11 84.3C123.487 85.5317 125.433 87.4568 126.69 89.82C129.32 94.76 129.69 99.71 127.92 103.71C129.587 107.049 130.138 110.835 129.49 114.51ZM123.01 109.31C121.612 110.048 120.056 110.434 118.475 110.434C116.894 110.434 115.338 110.048 113.94 109.31L114.67 104.46C117.75 104.76 120.26 103.8 121.57 101.83C123.04 99.64 122.81 96.39 120.95 92.9C118.87 88.99 114.38 88.37 111.89 88.34H111.73C105.49 88.34 99.13 91.89 96.56 96.52L92.82 94.73C93.5553 92.3449 94.8046 90.15 96.48 88.3C95.0376 87.0754 93.9474 85.4887 93.3217 83.703C92.696 81.9173 92.5574 79.9971 92.92 78.14L96.61 77.8C96.7789 79.302 97.4 80.7172 98.3911 81.8583C99.3822 82.9994 100.697 83.8125 102.16 84.19C105.238 82.8161 108.58 82.1335 111.95 82.19C112.43 82.19 112.89 82.24 113.36 82.27C110.969 78.0312 107.18 74.7545 102.64 73C91.56 68.7 84.09 75.37 82.38 77.67C78.26 83.19 80.9 88.41 82.91 91.8L79.61 94.8C76.736 92.314 74.8075 88.9127 74.15 85.17C69.92 86.44 64.24 86.17 61.06 80.74L64.06 78.68C67.43 81.2 72.78 80.98 75.32 77.87C75.9252 76.4949 76.6905 75.1959 77.6 74C79.044 72.093 80.7864 70.4316 82.76 69.08C74.47 66.82 62.76 67.19 55.68 71.73C53.7668 72.841 52.192 74.4517 51.1244 76.3895C50.0569 78.3274 49.5368 80.5192 49.62 82.73C49.62 86.3 52.42 91.94 56.19 92.82L54 97.07C51.5946 96.5129 49.4109 95.2487 47.73 93.44L44.48 97.58L41.23 96L44.41 87.68C43.8904 86.064 43.624 84.3774 43.62 82.68C43.628 81.3361 43.7687 79.9963 44.04 78.68C34.04 82.81 29.1 89.68 27.29 95.96C25.9 100.79 26.44 105.15 28.72 107.49C30.53 109.35 33.3 109.79 35.91 109.62L42.91 104.17L45.21 106.11L43.13 112.93C44.22 116.4 47.79 118.19 54.3 116.93C54.6375 114.169 55.7272 111.554 57.45 109.37C58.7133 107.552 60.3846 106.056 62.33 105L65.75 95.79L69.17 95.64L68.8 103.19C74.55 102.6 80.98 103.77 86.97 102.87L88.07 106.87C79.29 110.93 70.3 104.31 62.15 113.04C59.22 116.18 60.34 118.91 62.15 121.66C64.76 125.59 69.66 123.23 74.67 121.66C82.26 119.34 87.77 117.66 98.16 118.51C95.68 113.8 95.92 108.11 99.24 101.85L104.13 103.78C100.7 111.69 103.91 116.27 106.13 118.29C109.56 121.41 114.72 122.35 118.13 120.47C119.436 119.749 120.559 118.737 121.412 117.513C122.265 116.289 122.825 114.885 123.05 113.41C123.275 112.051 123.258 110.663 123 109.31H123.01Z"
            fill="#000000" />
        </g>
        <text class="label" x="82" y="56" style="font-size:32px">LLM</text>
      </g>

      <!-- Right top: code snippet -->
      <rect class="codeBox" x="770" y="40" width="400" height="150"></rect>
      <g class="code" transform="translate(795,80)">
        <text x="0" y="0">
          <tspan class="kw">def</tspan>
          <tspan> </tspan>
          <tspan class="fn">problem</tspan>
          <tspan>(x: </tspan>
          <tspan class="id">np.ndarray</tspan>
          <tspan>) → </tspan>
          <tspan class="id">float</tspan>
          <tspan>:</tspan>
        </text>
        <text x="0" y="28">
          <tspan class="cm"># f(x) = Σ xᵢ</tspan>
        </text>
        <text x="0" y="56">
          <tspan class="kw">return</tspan>
          <tspan> </tspan>
          <tspan class="id">np.sum</tspan>
          <tspan>(x)</tspan>
        </text>
      </g>

      <!-- Right middle: pseudocode-style box -->
      <g transform="translate(770,245)">
        <rect class="pseudoBox" x="0" y="0" width="400" height="150" rx="16" ry="16"></rect>
        <line class="pseudoGutter" x1="44" y1="18" x2="44" y2="132"></line>
        <line class="pseudoLine" x1="16" y1="50" x2="384" y2="50"></line>
        <line class="pseudoLine" x1="16" y1="82" x2="384" y2="82"></line>
        <line class="pseudoLine" x1="16" y1="114" x2="384" y2="114"></line>
        <text class="pseudoNum" x="22" y="42">1</text>
        <text class="pseudoNum" x="22" y="74">2</text>
        <text class="pseudoNum" x="22" y="106">3</text>
        <g class="pseudoText" transform="translate(60,42)">
          <text x="0" y="0">
            <tspan class="sym">X, y</tspan>
            <tspan class="op"> ← </tspan>
            <tspan class="fn">LHS</tspan>
            <tspan>(</tspan>
            <tspan class="id">problem</tspan>
            <tspan>)</tspan>
          </text>
          <text x="0" y="32">
            <tspan class="sym">Φ</tspan>
            <tspan class="op"> ← </tspan>
            <tspan class="fn">ELA</tspan>
            <tspan>(</tspan>
            <tspan class="id">X</tspan>
            <tspan>, </tspan>
            <tspan class="id">y</tspan>
            <tspan>)</tspan>
          </text>
          <text x="0" y="64">
            <tspan class="kw">fitness</tspan>
            <tspan class="op"> ← </tspan>
            <tspan>||</tspan>
            <tspan class="sym">Φ</tspan>
            <tspan class="op"> - </tspan>
            <tspan class="sym">Φ</tspan>
            <tspan>*</tspan>
            <tspan>||</tspan>
          </text>
        </g>
      </g>

      <!-- Arrows -->
      <!-- Input -> Operators -->
      <line x1="330" y1="320" x2="370" y2="320" stroke="var(--stroke)" stroke-width="2.2"
        marker-end="url(#arrowThin)" />
      <!-- Generated problems -> Operators -->
      <line x1="550" y1="450" x2="550" y2="395" stroke="var(--stroke)" stroke-width="2.2"
        marker-end="url(#arrowThin)" />

      <!-- Operators -> LLM (thin arrow up) -->
      <line x1="550" y1="245" x2="550" y2="190" stroke="var(--stroke)" stroke-width="2.2"
        marker-end="url(#arrowThin)" />

      <!-- LLM -> Code snippet (big arrow right) -->
      <line x1="630" y1="115" x2="760" y2="115" stroke="var(--stroke)" stroke-width="2.2"
        marker-end="url(#arrowThin)" />

      <!-- Code snippet -> Equations (down arrow) -->
      <line x1="950" y1="190" x2="950" y2="245" stroke="var(--stroke)" stroke-width="2.2"
        marker-end="url(#arrowThin)" />

      <!-- Pseudocode -> Generated problems (add) -->
      <path class="addLine" d="M970 395 C900 455 820 525 730 525" marker-end="url(#plusMarker)" />
    </svg>
  </div>
</body>

</html>
